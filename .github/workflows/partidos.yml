# Cada día actualiza los resultados de los encuentros entre equipos (Liga y Copa).
name: Actualizar resultados
on:
  schedule:
    - cron: "41 3 * * *"   # 03:41 UTC (04:41 / 05:41 en Madrid). Tarda unos 45-60 minutos.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer resultados de Liga y Copa
        run: python3 scripts/partidos.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Resultados: actualización automática"
          git pull --rebase
          git push
  publicar:
    needs: actualizar
    uses: ./.github/workflows/publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write
