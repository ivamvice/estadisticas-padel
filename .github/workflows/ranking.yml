# Cada día comprueba los rankings Masculino y Femenino y guarda una foto nueva si han cambiado los puntos.
name: Actualizar ranking
on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC (08:17 / 09:17 en Madrid)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Comprobar rankings
        run: python3 scripts/ranking.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Ranking: actualización automática"
          git pull --rebase
          git push
  publicar:
    needs: actualizar
    uses: ./.github/workflows/publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write
